[connectivity]
nk=aec_gpgpu:1:aec_gpgpu_1
# Keep the CU and its four AXI masters in the SLR1 HBM locality domain.
# Host BO allocation remains portable because it resolves each argument through
# kernel.group_id(), rather than a hard-coded HBM bank number.
sp=aec_gpgpu_1.m_axi_gmem0:HBM[16]
sp=aec_gpgpu_1.m_axi_gmem1:HBM[17]
sp=aec_gpgpu_1.m_axi_gmem2:HBM[18]
sp=aec_gpgpu_1.m_axi_gmem3:HBM[19]
slr=aec_gpgpu_1:SLR1

[clock]
# Keep the link clock, kernel metadata, and routed-timing target aligned.
freqHz=180000000:aec_gpgpu_1.ap_clk

[vivado]
prop=run.impl_1.strategy=Performance_Explore
prop=run.synth_1.strategy=Flow_PerfOptimized_high
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
